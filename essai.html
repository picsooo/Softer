<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"><link rel="icon" href="img/softel-logo.png">
<title>Essai gratuit et rendez-vous · SOFTEL</title>
</head><body>
<div id="hdr"></div>
<main id="app"></main>
<div id="ftr"></div>
<script src="data.js"></script><script src="app.js"></script><script src="sim.js"></script>
<script>
const t0=qp.get('t')||'essai';
const hasQ=qp.get('plan');const pl=hasQ?PLANS.find(p=>p.id===qp.get('plan')):null;
const days=[];{const d=new Date(2026,9,1);while(days.length<8){if(d.getDay()!==5&&d.getDay()!==6)days.push(new Date(d));d.setDate(d.getDate()+1)}}
const jr=['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
document.getElementById('app').innerHTML=`<div class="wrap" style="max-width:980px;padding-bottom:70px"><nav class="crumb"><a href="index.html">Accueil</a> / Essai et rendez-vous</nav>
<div class="ph"><h1>Découvrez <span class="gc"><b>Gest</b><i>Com</i></span> à votre rythme.</h1><p class="lead">Essai gratuit de 30 jours, présentation dans vos locaux ou devis personnalisé : choisissez la formule.</p></div>
<div class="tabs2" id="tb"><button data-t="essai">Essai gratuit 30 jours</button><button data-t="rdv">Rendez-vous de présentation</button><button data-t="devis">Demande de devis</button></div>
<div class="card" id="fz"></div></div>`;
Shell.init();
let tab=['essai','rdv','devis'].includes(t0)?t0:'essai',slot=null;
function common(){return `<label class="fld">Nom et prénom<input required></label><label class="fld">Société<input required></label><label class="fld">Téléphone<input type="tel" required placeholder="05 xx xx xx xx"></label><label class="fld">Email<input type="email" required></label>
 <label class="fld">Secteur<select>${SECTORS.map(s=>`<option>${s}</option>`).join('')}</select></label><label class="fld">Nombre d'utilisateurs<select><option>1</option><option>2 à 3</option><option>4 à 10</option><option>Plus de 10</option></select></label>`}
function draw(){document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const z=document.getElementById('fz');
 if(tab==='essai')z.innerHTML=`<h2 style="font-size:28px">Recevoir la version d'essai</h2><p class="note" style="margin:6px 0 18px">Lien de téléchargement et clé d'essai envoyés par email. Windows 7 et versions ultérieures.</p><form class="fg" id="f">${common()}<label class="fld full">Modules à tester<select><option>Tous les modules</option>${MODULES.map(m=>`<option>${m.n}</option>`).join('')}</select></label><button class="btn full" style="justify-content:center">Recevoir mon essai gratuit →</button></form>`;
 if(tab==='rdv')z.innerHTML=`<h2 style="font-size:28px">Planifier une présentation</h2><p class="note" style="margin:6px 0 18px">Un consultant SOFTEL vient vous présenter GestCom (Alger et environs) ou en visioconférence.</p><form class="fg" id="f">${common()}<div class="full" style="position:relative"><div class="fld" style="margin-bottom:8px">Choisissez un créneau</div><div class="slots" id="sl">${days.map((d,i)=>['10:00','14:00'].map(h=>`<button type="button" data-s="${i}-${h}">${jr[d.getDay()]} ${d.getDate()}/10<small>${h}</small></button>`).join('')).join('')}</div><span class="postit gr" style="--r:3deg;top:-26px;right:0">Cliquez un créneau</span></div>
  <label class="fld full">Lieu<select><option>Dans nos locaux</option><option>Visioconférence</option><option>Chez SOFTEL — ${SF.addr}</option></select></label><button class="btn full" style="justify-content:center">Confirmer le rendez-vous →</button></form>`;
 if(tab==='devis')z.innerHTML=`<h2 style="font-size:28px">Demander un devis</h2>${pl?`<div class="card" style="background:var(--paper);margin:14px 0"><b>Configuration choisie</b><div class="srow"><span>Offre</span><b>${pl.n} — ${qp.get('bill')==='ab'?'abonnement annuel':'licence définitive'}</b></div><div class="srow"><span>Postes</span><b>${qp.get('postes')}</b></div>${qp.get('mods')?`<div class="srow"><span>Modules en option</span><b>${qp.get('mods').split(',').map(x=>modById(x).n).join(', ')}</b></div>`:''}<div class="srow t"><span>Estimation</span><b>${DA(+qp.get('total')||0)}</b></div></div>`:`<p class="note" style="margin:6px 0 18px">Astuce : utilisez le <a href="tarifs.html" style="color:var(--blue);font-weight:700">configurateur</a> pour pré-remplir votre besoin.</p>`}<form class="fg" id="f">${common()}<label class="fld full">Précisions<textarea rows="4" placeholder="Nombre de dépôts, reprise de données, besoins spécifiques…"></textarea></label><button class="btn full" style="justify-content:center">Envoyer ma demande de devis →</button></form>`;
 document.querySelectorAll('#sl button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sl button').forEach(x=>x.classList.remove('on'));b.classList.add('on');slot=b.textContent});
 document.getElementById('f').onsubmit=e=>{e.preventDefault();if(tab==='rdv'&&!slot){toast('Choisissez un créneau');return}
  const msg={essai:['Votre essai gratuit est en route.','Vous recevrez le lien de téléchargement et votre clé d\'essai de 30 jours par email.'],rdv:['Rendez-vous demandé.','Créneau : '+slot.replace(/(\d{2}:\d{2})/,' à $1')+'. Un consultant vous appelle pour confirmer.'],devis:['Demande de devis envoyée.','Notre service commercial vous répond sous 24 h ouvrées.']}[tab];
  z.innerHTML=`<div class="okb"><span class="ok">${ic(I.check,34)}</span><h2 style="font-size:30px">${msg[0]}</h2><p class="lead">${msg[1]}</p><p class="note">(Simulation — aucune donnée envoyée.)</p><div class="acts" style="justify-content:center"><a class="btn" href="demo.html">Tester la démo en attendant</a><a class="btn ghost" href="index.html">Accueil</a></div></div>`}}
document.querySelectorAll('#tb button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});draw();</script></body></html>
